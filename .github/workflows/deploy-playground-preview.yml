name: Deploy Playground Preview

on:

  pull_request:

    paths:

      - "packages/**"

      - "scripts/**"

      - "package.json"

      - "package-lock.json"

      - ".github/workflows/deploy-playground-preview.yml"

  workflow_dispatch:

permissions:

  contents: read

jobs:

  build-preview:

    name: Build Playground Preview

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v5

      - name: Setup Node.js

        uses: actions/setup-node@v6

        with:

          node-version-file: ".nvmrc"

          cache: npm

      - name: Install dependencies

        run: npm ci

      - name: Build

        run: npm run build

      - name: Upload preview artifact

        uses: actions/upload-artifact@v4

        with:

          name: playground-preview

          path: build/
