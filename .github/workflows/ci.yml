name: CI

on:

  merge_group:

  pull_request:

  push:

  workflow_dispatch:

concurrency:

  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.sha || github.sha }}"

  cancel-in-progress: true

jobs:

  build:

    name: Build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v5

      - name: Setup Node.js

        uses: actions/setup-node@v6

        with:

          node-version-file: ".nvmrc"

          cache: npm

      - name: Install dependencies

        run: npm ci

      - name: Build

        run: npm run build

  test:

    name: Test

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Checkout

        uses: actions/checkout@v5

      - name: Setup Node.js

        uses: actions/setup-node@v6

        with:

          node-version-file: ".nvmrc"

          cache: npm

      - name: Install dependencies

        run: npm ci

      - name: Test

        run: npm test
